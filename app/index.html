<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b5f57"><meta name="color-scheme" content="light dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Foco"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>html{background:#edeff1}@media(prefers-color-scheme:dark){html:not([data-theme="light"]){background:#0f1316}}[hidden]{display:none!important}body{margin:0}.fx-acc{margin-top:2px}.fx-screen{position:fixed;inset:0;z-index:50;background:rgba(8,12,16,.6);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.fx-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(400px,100%);display:grid;gap:12px}.fx-card h1{font-size:24px}.fx-hint{color:var(--ink-2);font-size:13px}.fx-f{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}.fx-f input{font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}.fx-msg{min-height:18px;font-size:13px;color:var(--danger)}.fx-row{display:flex;flex-wrap:wrap;gap:8px}.fx-hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}.fx-link{background:none;border:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:13px;padding:4px 0;text-align:left}</style></head><body><script src="supabase.js"></script><script src="shim.js"></script>
<title>Foco Semanal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&display=swap">
<style>
/* Foco Semanal · lenguaje visual: horario de cursada.
   Una sola cosa llama la atención: bloques sólidos del color de cada meta (agenda, semana, foco). El resto queda quieto: texto, aire y líneas finas. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --ink: #10131a;
  --ink-2: #566070;
  --line: #dde1e8;
  --accent: #2336d1;
  --on-accent: #ffffff;
  --danger: #bd2a22;
  --bad: #c0302a;
  --mid: #9a5b00;
  --good: #0f7a50;
  --c0: #2336d1; --c0-on: #ffffff;
  --c1: #c93a24; --c1-on: #ffffff;
  --c2: #0f7a50; --c2-on: #ffffff;
  --c3: #7339d6; --c3-on: #ffffff;
  --c4: #f0b400; --c4-on: #10131a;
  --c5: #c42d6b; --c5-on: #ffffff;
  --font-body: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: var(--font-body);
  --font-mono: var(--font-body);
  --row: 44px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015; --surface: #151a21; --surface-2: #1d232c; --ink: #eef1f5; --ink-2: #9ba6b4; --line: #272f3a;
    --accent: #8fa3ff; --on-accent: #0d1015; --danger: #ff8b82; --bad: #ff8b82; --mid: #f0b24a; --good: #4fd39a;
    --c0: #8fa3ff; --c0-on: #0d1015; --c1: #ff8f78; --c1-on: #0d1015; --c2: #4fd39a; --c2-on: #0d1015;
    --c3: #bd9bff; --c3-on: #0d1015; --c4: #ffd24a; --c4-on: #0d1015; --c5: #ff90ba; --c5-on: #0d1015;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1015; --surface: #151a21; --surface-2: #1d232c; --ink: #eef1f5; --ink-2: #9ba6b4; --line: #272f3a;
  --accent: #8fa3ff; --on-accent: #0d1015; --danger: #ff8b82; --bad: #ff8b82; --mid: #f0b24a; --good: #4fd39a;
  --c0: #8fa3ff; --c0-on: #0d1015; --c1: #ff8f78; --c1-on: #0d1015; --c2: #4fd39a; --c2-on: #0d1015;
  --c3: #bd9bff; --c3-on: #0d1015; --c4: #ffd24a; --c4-on: #0d1015; --c5: #ff90ba; --c5-on: #0d1015;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-inline: 16px; padding-block: 20px 28px; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Estructura */
.shell { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 40px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); display: grid; gap: 28px; }
.rail-top { display: grid; gap: 6px; justify-items: start; }
.brand { font-weight: 800; font-size: 22px; letter-spacing: -0.04em; line-height: 1; }
.brand small { display: none; }
.status { font-size: 12px; color: var(--ink-2); min-height: 18px; }
.pill { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: transform 140ms var(--ease-out); }
.pill:active { transform: scale(0.97); }
.nav { display: grid; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 9px 12px; border-radius: 10px; cursor: pointer; color: var(--ink-2); font-weight: 600; text-align: left; transition: background-color 140ms ease, color 140ms ease, transform 140ms var(--ease-out); }
.nav-item svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav-item:active { transform: scale(0.97); }
.nav-item[aria-current="page"] { background: var(--ink); color: var(--bg); }
@media (hover: hover) and (pointer: fine) { .nav-item:hover:not([aria-current="page"]) { background: var(--surface-2); color: var(--ink); } }
main { min-width: 0; }

/* Piezas comunes */
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 20px; margin-bottom: 28px; }
.day-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 32px; }
.daynum { font-size: clamp(76px, 11vw, 120px); line-height: 0.8; font-weight: 800; letter-spacing: -0.06em; }
.daytxt { display: grid; gap: 2px; padding-bottom: 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.daytxt span + span { color: var(--ink-2); font-weight: 500; font-size: 16px; letter-spacing: 0; }
.card { display: grid; gap: 14px; align-content: start; min-width: 0; border-top: 1px solid var(--line); padding-top: 18px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.stack { display: grid; gap: 32px; align-content: start; min-width: 0; }
.stack > .card:first-child { border-top: 0; padding-top: 0; }
.two-col { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 15px; cursor: pointer; font-weight: 600; transition: transform 140ms var(--ease-out), background-color 140ms ease, border-color 140ms ease, color 140ms ease; }
.btn:active:not([disabled]) { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .btn:hover:not([disabled]) { border-color: var(--ink-2); } }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; min-width: 0; max-width: 100%; transition: border-color 140ms ease, background-color 140ms ease;
}
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
textarea { width: 100%; resize: vertical; min-height: 120px; line-height: 1.45; }
.field textarea { min-height: 80px; }
.field { display: grid; gap: 5px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.field select, .field input, .field textarea { font-size: 15px; font-weight: 400; color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-form { display: flex; gap: 8px; flex: 1 1 320px; max-width: 540px; min-width: 0; }
.row-form input { flex: 1; min-width: 0; }
.row-form .btn { flex: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.meta { font-size: 13px; color: var(--ink-2); }
.hint { color: var(--ink-2); font-size: 14px; }
.empty { color: var(--ink-2); }
.msg { min-height: 18px; font-size: 13px; color: var(--danger); }
.warn { font-size: 13px; color: var(--mid); }
.chip { font-size: 12px; font-weight: 600; padding: 2px 9px; border: 1px solid currentColor; border-radius: 999px; opacity: 0.85; white-space: nowrap; }
.note { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 16px; background: var(--surface-2); border-radius: 12px; margin-bottom: 20px; color: var(--ink-2); font-size: 14px; }
.flash { padding: 10px 14px; border-radius: 10px; background: var(--surface-2); font-size: 14px; margin-bottom: 14px; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); flex: none; display: inline-block; }
.goalname { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 14px; }
.goalname i { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.list li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .grow { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.list small { display: block; color: var(--ink-2); font-size: 13px; font-weight: 400; }
.x { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 20px; line-height: 1; padding: 4px 9px; border-radius: 8px; }
@media (hover: hover) and (pointer: fine) { .x:hover { color: var(--danger); background: var(--surface-2); } }
.mini { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

/* Hoy: agenda del día en bloques de color */
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.tl li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 14px 16px; border-radius: 14px; background: var(--gc, var(--surface-2)); color: var(--on, var(--ink)); }
.tl li.busy { background: transparent; color: var(--ink-2); border: 1px dashed var(--line); }
.tl li.done { opacity: 0.55; }
.tl li.done .grow b { text-decoration: line-through; }
.tl time { font-size: 13px; font-weight: 600; min-width: 96px; opacity: 0.9; }
.tl .grow { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; }
.tl .grow b { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; display: block; }
.tl .grow small { display: block; font-size: 13px; opacity: 0.85; margin-top: 1px; }
.tl li .btn { background: color-mix(in srgb, var(--on) 14%, transparent); border-color: transparent; color: var(--on); }
.tl li .btn.primary { background: var(--on); color: var(--gc); }
.tl li .btn.ghost { background: transparent; }
.tl li.busy .btn { color: var(--ink); }
.strength-top { display: flex; align-items: center; gap: 16px; }
.score { display: grid; gap: 8px; min-width: 96px; }
.score b { font-size: 68px; line-height: 0.85; font-weight: 800; letter-spacing: -0.05em; }
.sbar { display: block; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--rc, var(--bad)); border-radius: 3px; }
.tone-mid { --rc: var(--mid); }
.tone-good { --rc: var(--good); }
.tone-bad { --rc: var(--bad); }
.lbl { font-size: 15px; font-weight: 700; color: var(--rc, var(--ink)); }
.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.tips li { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; font-size: 14px; }
.tips li span { min-width: 0; overflow-wrap: anywhere; }
.coach-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.6; max-width: 62ch; }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.todo li { display: flex; align-items: center; gap: 10px; }
.todo .t { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.todo .t small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-2); }

/* Plan */
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 18px; }
.goal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 6px; }
.swatch { width: 28px; height: 28px; border-radius: 8px; border: 0; background: var(--gc); cursor: pointer; flex: none; transition: transform 140ms var(--ease-out); }
.swatch:active { transform: scale(0.92); }
.goal-title { flex: 1 1 220px; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; background: transparent !important; border-color: transparent !important; padding-inline: 6px; }
.goal-why { width: 100%; color: var(--ink-2); margin-bottom: 4px; background: transparent !important; border-color: transparent !important; padding-inline: 6px; }
@media (hover: hover) and (pointer: fine) { .goal-title:hover, .goal-why:hover { background: var(--surface-2) !important; } }
.goal-title:focus, .goal-why:focus { background: var(--surface) !important; border-color: var(--accent) !important; }
.season { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.season-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.season-head .s-name { flex: 1 1 200px; font-weight: 700; }
.date-l { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.actions { list-style: none; margin: 0 0 8px; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.actions li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.actions li.done .a-title { text-decoration: line-through; color: var(--ink-2); }
.actions input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--gc, var(--accent)); flex: none; }
.a-title { flex: 1; min-width: 0; }
.a-est { width: 72px; flex: none; }
.unit { color: var(--ink-2); font-size: 13px; }
.add-action input { width: 100%; border-style: dashed; }

/* Semana */
.week-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px; margin-bottom: 14px; }
.week-bar h1 { margin-right: auto; font-size: 30px; }
.tools { margin-bottom: 14px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 28px; margin-bottom: 12px; font-size: 14px; color: var(--ink-2); }
.stats b { color: var(--ink); font-weight: 700; }
.hours-bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-bottom: 20px; position: relative; }
.hours-bar i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--accent) 35%, var(--surface-2)); border-radius: 3px; }
.hours-bar i.done { background: var(--accent); }
.week-layout { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 24px; align-items: start; }
.week-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.week { min-width: 700px; }
.week-head, .week-body { display: grid; grid-template-columns: 44px repeat(7, minmax(0, 1fr)); }
.week-head { border-bottom: 1px solid var(--line); }
.dh { padding: 10px 6px 8px; text-align: center; font-size: 13px; color: var(--ink-2); font-weight: 500; position: relative; }
.dh b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); line-height: 1.15; }
.dh.today b { color: var(--accent); }
.dh.today::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: -1px; height: 3px; background: var(--accent); border-radius: 3px 3px 0 0; }
.hours div { height: var(--row); font-size: 11px; color: var(--ink-2); text-align: right; padding-right: 8px; transform: translateY(-8px); }
.col { position: relative; border-left: 1px solid var(--line); cursor: cell; background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% var(--row); }
.col.today { background-color: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.blk { position: absolute; left: 3px; right: 3px; text-align: left; border: 0; border-radius: 9px; padding: 5px 8px; overflow: hidden; cursor: grab; font-size: 12px; line-height: 1.2; user-select: none;
  background: var(--gc); color: var(--on, var(--ink)); transition: transform 140ms var(--ease-out); }
.blk:active { transform: scale(0.98); }
.blk b { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-weight: 700; font-size: 12.5px; }
.blk span { font-size: 11px; opacity: 0.88; }
.blk.short b { -webkit-line-clamp: 1; }
.blk.short { padding-block: 4px; }
.blk.tiny span { display: none; }
.blk.done { opacity: 0.5; }
.blk.done b { text-decoration: line-through; }
.blk.dragging { z-index: 5; opacity: 0.92; cursor: grabbing; box-shadow: 0 8px 24px rgba(8, 12, 20, 0.28); transition: none; }
.busyblk { position: absolute; left: 3px; right: 3px; border-radius: 9px; padding: 3px 8px; overflow: hidden; font-size: 11.5px; color: var(--ink-2); border: 1px dashed var(--ink-2);
  background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--ink-2) 14%, transparent) 6px 7px); }
.now { position: absolute; left: 0; right: 0; height: 2px; background: var(--danger); pointer-events: none; }
.now::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.side { padding: 0 0 0 4px; }
.side h2 { margin-bottom: 4px; }
.side p { margin: 0 0 12px; color: var(--ink-2); font-size: 13px; }
.todo .btn { flex: none; }

/* Foco: la sesión activa ocupa todo el color de la meta */
.focus-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.panel + .panel { margin-top: 20px; }
.panel.session { background: var(--gc); border-color: transparent; color: var(--on); padding: 28px 24px 24px; gap: 18px; }
.panel.session .goalname { color: var(--on); opacity: 0.85; }
.panel.session .goalname i { background: var(--on); }
.panel.session .meta { color: var(--on); opacity: 0.85; }
.panel.session .btn { background: color-mix(in srgb, var(--on) 14%, transparent); border-color: transparent; color: var(--on); }
.panel.session .btn.primary { background: var(--on); color: var(--gc); }
.panel.session .btn.ghost { background: transparent; }
.panel.session .btn.danger { color: var(--on); }
.panel.session h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.panel.session .bar { background: color-mix(in srgb, var(--on) 22%, transparent); }
.panel.session .bar i { background: var(--on); }
.clock { font-weight: 800; font-size: clamp(76px, 17vw, 168px); line-height: 0.9; letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
.clock.over { opacity: 0.75; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; border-radius: 4px; }
.vol { width: 100%; accent-color: var(--accent); }

/* Coaching */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.check-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
.check-row .meta { white-space: nowrap; font-weight: 500; }
.cp-row { display: grid; gap: 5px; }
.cp-top { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.cp-top .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cp-row .mini i { background: var(--gc); }
.refl { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }

<script>
(function () {
  'use strict';

/* ==LOGIC:START== */
var L = (function () {
  'use strict';
  var START_H = 6, END_H = 24;
  var DUR_OPTS = [15, 30, 45, 60, 90, 120, 150, 180];
  var SOUNDS = ['off', 'brown', 'pink', 'rain'];
  var DAYS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  var DAYS_LONG = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
  var MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

  function pad(n) { return String(n).padStart(2, '0'); }
  function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function isKey(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function parseKey(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function weekKeys(mon) { var o = []; for (var i = 0; i < 7; i++) o.push(key(addDays(mon, i))); return o; }
  function dayDiff(a, b) { return Math.round((a - b) / 864e5); }
  function hm(min) { return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
  function parseHM(s) { var p = String(s || '').split(':').map(Number); return isNaN(p[0]) || isNaN(p[1]) ? NaN : p[0] * 60 + p[1]; }
  function fmtDur(min) {
    min = Math.round(min);
    var h = Math.floor(min / 60), m = min % 60;
    if (!h) return m + ' min';
    return m ? h + ' h ' + m + ' min' : h + ' h';
  }
  function stable(o) {
    if (Array.isArray(o)) return '[' + o.map(stable).join(',') + ']';
    if (o && typeof o === 'object') {
      return '{' + Object.keys(o).sort().map(function (k) { return JSON.stringify(k) + ':' + stable(o[k]); }).join(',') + '}';
    }
    return JSON.stringify(o === undefined ? null : o);
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function uid(p) { return p + Math.random().toString(36).slice(2, 10); }
  function nearestDur(min) {
    var best = DUR_OPTS[0];
    DUR_OPTS.forEach(function (d) { if (Math.abs(d - min) < Math.abs(best - min)) best = d; });
    return best;
  }
  function isObj(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function num(x, d, lo, hi) { x = Number(x); if (!isFinite(x)) x = d; return Math.min(hi, Math.max(lo, x)); }
  function str(x, d, max) { x = typeof x === 'string' ? x.trim() : ''; if (!x) x = d; return x.slice(0, max || 200); }

  /* Estado: acepta el formato viejo (v1) y devuelve siempre el v2 */
  function normalize(s, now) {
    now = now || new Date();
    s = isObj(s) ? s : {};
    var todayK = key(now);
    var out = { v: 2, goals: [], blocks: [], sessions: [], active: null, reflections: {}, coaching: {}, busy: [], settings: {} };
    var seen = {};
    function id(x, p) { x = typeof x === 'string' && x ? x : uid(p); while (seen[x]) x = uid(p); seen[x] = 1; return x; }
    var actionIds = {};
    arr(s.goals).filter(isObj).forEach(function (g) {
      var og = { id: id(g.id, 'g_'), title: str(g.title, 'Meta sin nombre', 120), color: Math.abs(parseInt(g.color, 10) || 0) % 6, why: str(g.why, '', 300), seasons: [] };
      if (g.example) og.example = true;
      arr(g.seasons).filter(isObj).forEach(function (se) {
        var os = { id: id(se.id, 's_'), name: str(se.name, 'Temporada', 80), start: isKey(se.start) ? se.start : todayK, end: isKey(se.end) ? se.end : key(addDays(now, 27)), actions: [] };
        if (os.end < os.start) os.end = os.start;
        arr(se.actions).filter(isObj).forEach(function (a) {
          var oa = { id: id(a.id, 'a_'), title: str(a.title, 'Acción sin nombre', 140), est: Math.round(num(a.est, 60, 5, 600)), done: !!a.done };
          actionIds[oa.id] = 1;
          os.actions.push(oa);
        });
        og.seasons.push(os);
      });
      out.goals.push(og);
    });
    arr(s.blocks).filter(isObj).forEach(function (b) {
      if (!isKey(b.date) || typeof b.actionId !== 'string' || !actionIds[b.actionId]) return;
      var st = Number(b.start), du = Number(b.dur);
      if (!isFinite(st) || !isFinite(du) || du <= 0) return;
      out.blocks.push({ id: id(b.id, 'b_'), actionId: b.actionId, date: b.date, start: Math.round(Math.max(0, Math.min(1435, st))), dur: Math.round(Math.max(5, Math.min(1440, du))), done: !!b.done });
    });
    arr(s.sessions).filter(isObj).forEach(function (x) {
      var m = Number(x.min);
      if (!isKey(x.date) || !isFinite(m) || m <= 0) return;
      out.sessions.push({
        id: id(x.id, 'f_'), actionId: typeof x.actionId === 'string' ? x.actionId : '', goalId: typeof x.goalId === 'string' ? x.goalId : '',
        title: str(x.title, 'Sesión', 140), goal: str(x.goal, '', 120), color: Math.abs(parseInt(x.color, 10) || 0) % 6, date: x.date,
        min: Math.round(Math.min(m, 1440)), notes: typeof x.notes === 'string' ? x.notes.slice(0, 1000) : '', distractions: Math.round(num(x.distractions, 0, 0, 999))
      });
    });
    out.sessions = out.sessions.slice(-600);
    var a = s.active;
    if (isObj(a) && typeof a.actionId === 'string' && isFinite(Number(a.startedAt)) && isFinite(Number(a.dur))) {
      out.active = {
        actionId: a.actionId, goalId: typeof a.goalId === 'string' ? a.goalId : '', blockId: typeof a.blockId === 'string' ? a.blockId : null,
        title: str(a.title, 'Sesión', 140), goal: str(a.goal, '', 120), color: Math.abs(parseInt(a.color, 10) || 0) % 6,
        dur: Math.round(num(a.dur, 25, 1, 600)), startedAt: Number(a.startedAt),
        pausedAt: a.pausedAt && isFinite(Number(a.pausedAt)) ? Number(a.pausedAt) : null, pausedMs: num(a.pausedMs, 0, 0, 1e10),
        notes: typeof a.notes === 'string' ? a.notes.slice(0, 1000) : '',
        distractions: arr(a.distractions).filter(function (t) { return typeof t === 'string' && t.trim(); }).slice(0, 50).map(function (t) { return t.trim().slice(0, 140); })
      };
    }
    if (isObj(s.reflections)) {
      Object.keys(s.reflections).forEach(function (k) {
        var r = s.reflections[k];
        if (!isKey(k) || !isObj(r)) return;
        var went = str(r.went, '', 600), change = str(r.change, '', 600);
        if (went || change) out.reflections[k] = { went: went, change: change };
      });
    }
    var c = isObj(s.coaching) ? s.coaching : {};
    if (isObj(c.day) && isKey(c.day.date) && typeof c.day.text === 'string') out.coaching.day = { date: c.day.date, text: c.day.text.slice(0, 4000) };
    if (isObj(c.week) && isKey(c.week.week) && typeof c.week.text === 'string') out.coaching.week = { week: c.week.week, text: c.week.text.slice(0, 4000) };
    arr(s.busy).filter(isObj).forEach(function (e) {
      var st = Number(e.start), du = Number(e.dur);
      if (!isKey(e.date) || !isFinite(st) || !isFinite(du) || du <= 0) return;
      out.busy.push({ id: id(e.id, 'e_'), date: e.date, start: Math.round(Math.max(0, st)), dur: Math.round(Math.min(1440, du)), title: str(e.title, 'Evento', 100) });
    });
    out.busy = out.busy.slice(0, 800);
    var st2 = isObj(s.settings) ? s.settings : {};
    out.settings = { sound: SOUNDS.indexOf(st2.sound) >= 0 ? st2.sound : 'off', volume: num(st2.volume, 0.4, 0, 1), capacity: Math.round(num(st2.capacity, 20, 1, 100)) };
    return out;
  }

  function seed(now) {
    now = now || new Date();
    var mon = mondayOf(now);
    var acts = [
      { id: uid('a_'), title: 'Definir qué entra en la primera versión', est: 60, done: false },
      { id: uid('a_'), title: 'Armar el esquema de la base de datos', est: 90, done: false },
      { id: uid('a_'), title: 'Programar la pantalla principal', est: 120, done: false },
      { id: uid('a_'), title: 'Usarlo una semana y anotar qué falta', est: 60, done: false }
    ];
    return normalize({
      v: 2,
      goals: [{ id: uid('g_'), title: 'Ejemplo: terminar la primera versión de mi proyecto', color: 0, example: true, why: 'Quiero tener algo que funcione y que use todos los días.',
        seasons: [{ id: uid('s_'), name: 'Temporada 1 · 4 semanas', start: key(mon), end: key(addDays(mon, 27)), actions: acts }] }],
      blocks: [
        { id: uid('b_'), actionId: acts[0].id, date: key(addDays(mon, 1)), start: 9 * 60, dur: 60, done: false },
        { id: uid('b_'), actionId: acts[1].id, date: key(addDays(mon, 3)), start: 18 * 60, dur: 90, done: false }
      ],
      sessions: [], active: null, reflections: {}, coaching: {}, busy: [], settings: {}
    }, now);
  }

  function prune(state, now) {
    now = now || new Date();
    var b0 = key(addDays(now, -90)), r0 = key(addDays(now, -120)), e0 = key(addDays(now, -14));
    state.blocks = state.blocks.filter(function (b) { return b.date >= b0; });
    state.busy = state.busy.filter(function (e) { return e.date >= e0; });
    Object.keys(state.reflections).forEach(function (k) { if (k < r0) delete state.reflections[k]; });
    if (state.sessions.length > 600) state.sessions = state.sessions.slice(-600);
    /* El documento guardado no puede pasar de 256 KiB: si crece de más, se descartan las sesiones y eventos más viejos */
    var guard = 0;
    while (JSON.stringify(state).length > 200000 && guard++ < 30) {
      if (state.sessions.length > 30) state.sessions = state.sessions.slice(Math.ceil(state.sessions.length * 0.2));
      else if (state.busy.length > 100) state.busy = state.busy.slice(Math.ceil(state.busy.length * 0.2));
      else break;
    }
    return state;
  }

  function indexActions(state) {
    var m = new Map();
    state.goals.forEach(function (g) { g.seasons.forEach(function (s) { s.actions.forEach(function (a) { m.set(a.id, { a: a, s: s, g: g }); }); }); });
    return m;
  }

  /* Fuerza del plan: siete controles que suman 100 */
  function planStrength(state, now) {
    now = now || new Date();
    var keys = weekKeys(mondayOf(now)), wkS = keys[0], wkE = keys[6], todayK = key(now);
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var idx = indexActions(state);
    var act = [];
    state.goals.forEach(function (g) { g.seasons.forEach(function (se) { if (se.start <= wkE && se.end >= wkS) act.push(se); }); });
    var pend = [];
    act.forEach(function (se) { se.actions.forEach(function (a) { if (!a.done) pend.push(a); }); });
    var checks = [];
    function add(id, title, max, got, tip, go) {
      got = Math.max(0, Math.min(max, Math.round(got)));
      checks.push({ id: id, title: title, max: max, got: got, tip: got < max ? tip : '', go: go || '' });
    }
    add('season', 'Temporada activa', 15, act.length ? 15 : 0, 'No tenés ninguna temporada activa esta semana. Creá una en Plan con fechas que incluyan hoy.', 'plan');
    var sized = pend.filter(function (a) { return a.est >= 15 && a.est <= 180; }).length;
    add('sizing', 'Acciones bien dimensionadas', 15, pend.length ? 15 * sized / pend.length : 0,
      pend.length ? (pend.length - sized) + ' de ' + pend.length + ' acciones pendientes duran menos de 15 min o más de 3 h. Partí las largas en pasos más chicos.' : 'No hay acciones pendientes en tus temporadas activas. Cargá las próximas acciones.', 'plan');
    var scheduled = {};
    state.blocks.forEach(function (b) { if (b.date >= wkS && idx.has(b.actionId)) scheduled[b.actionId] = 1; });
    var sch = pend.filter(function (a) { return scheduled[a.id]; }).length;
    add('scheduled', 'Acciones con día y hora', 25, pend.length ? 25 * sch / pend.length : 0,
      pend.length ? (pend.length - sch) + ' de ' + pend.length + ' acciones pendientes no tienen horario. Decidir de antemano cuándo las hacés aumenta mucho las chances de cumplirlas.' : 'Sin acciones pendientes no hay nada para agendar.', 'semana');
    var wb = state.blocks.filter(function (b) { return keys.indexOf(b.date) >= 0 && idx.has(b.actionId); });
    var P = wb.reduce(function (t, b) { return t + b.dur; }, 0), C = state.settings.capacity * 60, r = P / C, g4, tip4 = '';
    if (P === 0) { g4 = 0; tip4 = 'Todavía no agendaste tiempo esta semana.'; }
    else if (r < 0.4) { g4 = 15 * 0.5 * (r / 0.4); tip4 = 'Agendaste ' + fmtDur(P) + ' de las ' + (C / 60) + ' h que podés dedicar. Sumá bloques.'; }
    else if (r <= 1) { g4 = 15; }
    else if (r <= 1.25) { g4 = 15 * 0.6; tip4 = 'Agendaste ' + fmtDur(P) + ', más que tus ' + (C / 60) + ' h. Sacá un bloque para tener margen.'; }
    else { g4 = 15 * 0.2; tip4 = 'Agendaste ' + fmtDur(P) + ', mucho más que tus ' + (C / 60) + ' h. Sacá varios bloques o pasalos a la semana siguiente.'; }
    add('load', 'Carga realista', 15, g4, tip4, 'semana');
    var perDay = {};
    wb.forEach(function (b) { perDay[b.date] = (perDay[b.date] || 0) + b.dur; });
    var over = Object.keys(perDay).filter(function (k) { return perDay[k] > 360; });
    add('daycap', 'Días con margen', 10, wb.length ? 10 - 4 * over.length : 0,
      wb.length ? over.length + (over.length === 1 ? ' día pasa' : ' días pasan') + ' de 6 h de bloques. Repartí la carga para no llegar agotado.' : 'Sin bloques no se puede ver cómo repartís la carga.', 'semana');
    var from = key(addDays(now, -6));
    var past = state.blocks.filter(function (b) { return idx.has(b.actionId) && b.date >= from && (b.date < todayK || (b.date === todayK && b.start + b.dur <= nowMin)); });
    var pdone = past.filter(function (b) { return b.done; }).length;
    add('follow', 'Bloques cumplidos', 10, past.length ? 10 * pdone / past.length : 5,
      past.length ? 'Cumpliste ' + pdone + ' de ' + past.length + ' bloques de los últimos 7 días. Probá bloques más cortos o con más margen.' : '', 'semana');
    var rc = 0;
    for (var i = 0; i < 7; i++) { if (state.reflections[key(addDays(now, -i))]) rc++; }
    add('reflect', 'Cierres del día', 10, 10 * Math.min(rc, 3) / 3,
      'Hiciste ' + rc + ' cierres en los últimos 7 días. Dos minutos al final del día para anotar qué salió bien y qué ajustar hacen que mañana salga mejor.', 'hoy');
    var score = checks.reduce(function (t, c) { return t + c.got; }, 0);
    var label = score < 40 ? 'Débil' : score < 70 ? 'En construcción' : score < 90 ? 'Sólida' : 'Muy sólida';
    var tips = checks.filter(function (c) { return c.tip; }).sort(function (a, b) { return (b.max - b.got) - (a.max - a.got); }).slice(0, 3);
    return { score: score, label: label, tone: score >= 70 ? 'good' : score >= 40 ? 'mid' : 'bad', checks: checks, tips: tips };
  }

  /* Brújula: cómo se reparte el tiempo de la semana entre las metas */
  function compass(state, mon) {
    var keys = weekKeys(mon), idx = indexActions(state);
    var rows = state.goals.map(function (g) {
      return { id: g.id, title: g.title, color: g.color, planned: 0, done: 0, focus: 0, share: 0,
        active: g.seasons.some(function (se) { return se.start <= keys[6] && se.end >= keys[0]; }) };
    });
    var by = {};
    rows.forEach(function (r) { by[r.id] = r; });
    state.blocks.forEach(function (b) {
      if (keys.indexOf(b.date) < 0) return;
      var i = idx.get(b.actionId);
      if (!i || !by[i.g.id]) return;
      by[i.g.id].planned += b.dur;
      if (b.done) by[i.g.id].done += b.dur;
    });
    state.sessions.forEach(function (s) {
      if (keys.indexOf(s.date) < 0) return;
      var gid = s.goalId;
      if (!gid || !by[gid]) { var i = idx.get(s.actionId); gid = i ? i.g.id : ''; }
      if (gid && by[gid]) by[gid].focus += s.min;
    });
    var total = rows.reduce(function (t, r) { return t + r.planned; }, 0);
    rows.forEach(function (r) { r.share = total ? r.planned / total : 0; });
    return { rows: rows, total: total, idle: rows.filter(function (r) { return r.active && r.planned === 0; }) };
  }

  function weekStats(state, mon) {
    var keys = weekKeys(mon), idx = indexActions(state), planned = 0, done = 0, focus = 0;

        : '<button class="btn primary" data-act="coach-' + kind + '">' + (fresh ? 'Pedir de nuevo' : 'Pedir coaching') + '</button>') + '</div>';
    }
    return h + '</section>';
  }

  /* ---------- Hoy ---------- */
  function viewToday() {
    var now = new Date(), todayK = key(now), idx = index(), items = [];
    state.blocks.forEach(function (b) { if (b.date === todayK && idx.has(b.actionId)) items.push({ t: 'b', start: b.start, b: b }); });
    state.busy.forEach(function (e) { if (e.date === todayK) items.push({ t: 'e', start: e.start, e: e }); });
    items.sort(function (x, y) { return x.start - y.start; });
    var ps = L.planStrength(state, now), keys = L.weekKeys(mondayOf(now));
    var h = '<h1 class="day-head" aria-label="Hoy, ' + esc(longDate(now)) + '"><span class="daynum">' + now.getDate() + '</span><span class="daytxt"><span>' + DAYS_LONG[(now.getDay() + 6) % 7] + '</span><span>' + MONTHS_FULL[now.getMonth()] + ' de ' + now.getFullYear() + '</span></span></h1><div class="two-col"><div class="stack">';
    h += '<section class="card"><div class="card-head"><h2>Tu día</h2><button class="btn small" data-act="open-compose-today">Agendar un bloque</button></div>';
    if (!items.length) h += '<p class="empty">No hay nada agendado para hoy. Elegí una acción pendiente y dale un horario.</p>';
    else {
      h += '<ul class="tl">';
      items.forEach(function (it) {
        if (it.t === 'e') {
          h += '<li class="busy"><time>' + hm(it.e.start) + '–' + hm(it.e.start + it.e.dur) + '</time><span class="grow"><b>' + esc(it.e.title) + '</b><small>Calendario</small></span></li>';
        } else {
          var i = idx.get(it.b.actionId);
          h += '<li class="' + (it.b.done ? 'done' : '') + '" style="' + gcStyle(i.g) + '"><time>' + hm(it.b.start) + '–' + hm(it.b.start + it.b.dur) + '</time>' +
            '<span class="grow"><b>' + esc(i.a.title) + '</b><small>' + esc(i.g.title) + '</small></span>' +
            (it.b.done ? '<button class="btn small ghost" data-act="tl-done" data-block-id="' + it.b.id + '">Deshacer</button><span class="chip">Hecho</span>'
              : '<button class="btn small primary" data-act="focus-start-block" data-block-id="' + it.b.id + '">Empezar</button><button class="btn small" data-act="tl-done" data-block-id="' + it.b.id + '">Hecho</button>') + '</li>';
        }
      });
      h += '</ul>';
    }
    h += '</section>';
    var r = state.reflections[todayK] || { went: '', change: '' };
    h += '<section class="card"><h2>Cierre del día</h2><p class="hint">Dos minutos para anotar qué salió bien y qué ajustás mañana.</p>' +
      '<label class="field">¿Qué salió bien hoy?<textarea id="refWent" data-f="ref-went" maxlength="600">' + esc(r.went) + '</textarea></label>' +
      '<label class="field">¿Qué ajustás para mañana?<textarea id="refChange" data-f="ref-change" maxlength="600">' + esc(r.change) + '</textarea></label></section>';
    h += '</div><div class="stack">' + strengthCard(ps, true) + coachCard('day');
    h += '<section class="card"><h2>Sin horario</h2><p class="hint">Acciones de tus temporadas activas que todavía no tienen bloque.</p>' + todoList(unscheduled(keys), 5) + '</section>';
    return h + '</div></div>';
  }

  /* ---------- Plan ---------- */
  function viewPlan() {
    var h = head('Plan', '<form id="newGoal" class="row-form"><label class="sr" for="newGoalTitle">Nueva meta</label>' +
      '<input id="newGoalTitle" type="text" maxlength="120" autocomplete="off" placeholder="Nueva meta, por ejemplo: rendir un final">' +
      '<button class="btn primary" type="submit">Agregar meta</button>' +
      (aiOn() ? '<button class="btn" type="button" data-act="plan-open">Planificar con IA</button>' : '') + '</form>');

    }
    if (!state.goals.length) h += '<p class="empty">Todavía no hay metas. Escribí una arriba, dividila en una temporada de unas semanas y cargale las acciones.</p>';
    state.goals.forEach(function (g) {
      h += '<section class="goal" data-goal="' + g.id + '" style="' + gcStyle(g) + '"><div class="goal-head">' +
        '<button class="swatch" data-act="cycle-color" aria-label="Cambiar color de la meta" title="Cambiar color"></button>' +

        '<input class="goal-why" data-f="goal-why" type="text" maxlength="300" value="' + esc(g.why) + '" placeholder="¿Por qué te importa esta meta?" aria-label="Por qué te importa esta meta">';
      g.seasons.forEach(function (se) {
        h += '<div class="season" data-season="' + se.id + '"><div class="season-head">' +
          '<input class="s-name" data-f="season-name" type="text" maxlength="80" value="' + esc(se.name) + '" aria-label="Nombre de la temporada">' +
          '<label class="date-l">Desde <input data-f="season-start" type="date" value="' + esc(se.start) + '"></label>' +
          '<label class="date-l">Hasta <input data-f="season-end" type="date" value="' + esc(se.end) + '"></label>' +
          '<span class="meta" data-meta="' + se.id + '">' + esc(seasonMeta(se)) + '</span>' +
          '<button class="btn small danger" data-act="del-season" data-confirm="1">Eliminar temporada</button></div><ul class="actions">';
        se.actions.forEach(function (a) {
          h += '<li data-action="' + a.id + '"' + (a.done ? ' class="done"' : '') + '><input type="checkbox" data-f="act-done"' + (a.done ? ' checked' : '') + ' aria-label="Acción completada">' +
            '<input class="a-title" data-f="act-title" type="text" maxlength="140" value="' + esc(a.title) + '" aria-label="Acción">' +
            '<input class="a-est" data-f="act-est" type="number" min="5" max="600" step="5" value="' + esc(a.est) + '" aria-label="Minutos estimados"><span class="unit">min</span>' +
            '<button class="x" data-act="del-act" aria-label="Eliminar acción">×</button></li>';
        });
        h += '</ul><form class="add-action" data-season="' + se.id + '"><label class="sr" for="na_' + se.id + '">Nueva acción</label>' +
          '<input id="na_' + se.id + '" type="text" maxlength="140" autocomplete="off" placeholder="Nueva acción (Enter para agregar)"></form></div>';
      });
      h += '<div class="row" style="margin-top:12px"><button class="btn small" data-act="add-season">+ Temporada</button>' +
        (aiOn() ? '<button class="btn small" data-act="plan-open">+ Temporada con IA</button>' : '') + '</div></section>';
    });

  }

  /* ---------- Semana ---------- */
  function weekLabel(days) {
    var a = days[0], b = days[6];
    if (a.getMonth() === b.getMonth()) return a.getDate() + ' al ' + b.getDate() + ' de ' + MONTHS[b.getMonth()];
    return a.getDate() + ' ' + MONTHS[a.getMonth()] + ' al ' + b.getDate() + ' ' + MONTHS[b.getMonth()];
  }
  function gridRect(start, dur) {
    var s = Math.max(start, START_H * 60), e = Math.min(start + dur, END_H * 60);
    if (e <= s) return null;
    return { top: (s - START_H * 60) / 60 * ROW, height: Math.max(18, (e - s) / 60 * ROW - 2) };
  }
  function viewWeek() {
    var mon = addDays(mondayOf(new Date()), ui.week * 7);
    var days = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return addDays(mon, i); });
    var keys = days.map(key), todayK = key(new Date()), idx = index();
    var wb = state.blocks.filter(function (b) { return keys.indexOf(b.date) >= 0 && idx.has(b.actionId); });
    var st = L.weekStats(state, mon), total = 168 * 60;
    var h = '<div class="week-bar"><h1>Semana del ' + esc(weekLabel(days)) + '</h1>' +
      '<button class="btn small" data-act="week-prev" aria-label="Semana anterior">←</button>' +
      '<button class="btn small" data-act="week-today"' + (ui.week === 0 ? ' disabled' : '') + '>Hoy</button>' +
      '<button class="btn small" data-act="week-next" aria-label="Semana siguiente">→</button></div>';
    h += '<div class="row tools"><button class="btn small" data-act="ics-import">Importar calendario (.ics)</button>' +
      '<input type="file" id="icsFile" accept=".ics,text/calendar" hidden>' +
      (dl ? '<button class="btn small" data-act="csv-export">Exportar a Google Calendar (.csv)</button>' : '') +
      (state.busy.length ? '<button class="btn small ghost danger" data-act="ics-clear" data-confirm="1">Quitar eventos importados</button><span class="meta">' + state.busy.length + ' eventos importados</span>' : '') + '</div>';
    if (ui.flash) h += '<div class="flash" role="status">' + esc(ui.flash) + '</div>';
    h += '<div class="stats"><span>Planificado <b>' + fmtDur(st.planned) + '</b> de 168 h</span><span>Hecho <b>' + fmtDur(st.done) + '</b></span><span>Foco registrado <b>' + fmtDur(st.focus) + '</b></span></div>' +
      '<div class="hours-bar" role="img" aria-label="Horas planificadas sobre las 168 de la semana"><i style="width:' + Math.min(100, st.planned / total * 100) + '%"></i><i class="done" style="width:' + Math.min(100, st.done / total * 100) + '%"></i></div>';
    h += '<div class="week-layout"><div class="week-wrap"><div class="week"><div class="week-head"><div></div>';
    days.forEach(function (d, i) { h += '<div class="dh' + (key(d) === todayK ? ' today' : '') + '"><span>' + DAYS[i] + '</span><b>' + d.getDate() + '</b></div>'; });
    h += '</div><div class="week-body" style="height:' + ((END_H - START_H) * ROW) + 'px"><div class="hours">';
    for (var hh = START_H; hh < END_H; hh++) h += '<div>' + pad(hh) + ':00</div>';
    h += '</div>';
    var now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
    days.forEach(function (d) {
      var k = key(d);
      h += '<div class="col' + (k === todayK ? ' today' : '') + '" data-date="' + k + '">';
      state.busy.filter(function (e) { return e.date === k; }).forEach(function (e) {
        var rc = gridRect(e.start, e.dur);
        if (rc) h += '<div class="busyblk" style="top:' + rc.top + 'px;height:' + rc.height + 'px" title="' + esc(e.title) + ' ' + hm(e.start) + '–' + hm(e.start + e.dur) + '"><span>' + esc(e.title) + '</span></div>';
      });
      wb.filter(function (b) { return b.date === k; }).forEach(function (b) {
        var info = idx.get(b.actionId), rc = gridRect(b.start, b.dur);
        if (!rc) return;
        h += '<button class="blk' + (b.done ? ' done' : '') + (rc.height < 50 ? ' short' : '') + (rc.height < 30 ? ' tiny' : '') + '" data-block="' + b.id + '" style="top:' + rc.top + 'px;height:' + rc.height + 'px;' + gcStyle(info.g) + '">' +
          '<b>' + (b.done ? '✓ ' : '') + esc(info.a.title) + '</b><span>' + hm(b.start) + '–' + hm(b.start + b.dur) + '</span></button>';
      });
      if (k === todayK && nowMin >= START_H * 60 && nowMin < END_H * 60) h += '<div class="now" style="top:' + ((nowMin - START_H * 60) / 60 * ROW) + 'px"></div>';
      h += '</div>';
    });
    h += '</div></div></div><aside class="side"><h2>Sin horario</h2><p>Acciones de las temporadas activas que todavía no tienen bloque esta semana.</p>' + todoList(unscheduled(keys)) +
      '<p style="margin-top:12px">Tocá un hueco de la grilla para agendar a esa hora, o arrastrá un bloque para moverlo.</p></aside></div>';
    return h;
  }

  /* ---------- Foco ---------- */
  function viewFocus() {
    var idx = index(), a = state.active, h = '';
    if (a) {
      var el = elapsed(a), total = a.dur * 60000, rem = total - el;
      h += head('Foco') + '<div class="focus-grid"><div><section class="panel session" style="--gc:var(--c' + ((a.color || 0) % 6) + ');--on:var(--c' + ((a.color || 0) % 6) + '-on)">' +
        '<div><h2>' + esc(a.title) + '</h2><span class="goalname"><i></i>' + esc(a.goal || '') + '</span></div>' +
        '<div class="clock' + (rem < 0 ? ' over' : '') + '" id="clock">' + (rem >= 0 ? mmss(Math.ceil(rem / 1000) * 1000) : '+' + mmss(-rem)) + '</div>' +
        '<div class="bar"><i id="clockBar" style="width:' + Math.min(100, el / total * 100) + '%"></i></div>' +
        '<div class="meta" id="clockState">' + (a.pausedAt ? 'En pausa' : rem < 0 ? 'Tiempo cumplido, podés seguir o terminar' : 'Bloque de ' + fmtDur(a.dur)) + '</div>';
      if (ui.finishing) {
        h += '<p>¿Guardar la sesión de <b>' + fmtDur(Math.max(1, Math.round(el / 60000))) + '</b>?</p>' +
          '<div class="row"><button class="btn primary" data-act="focus-save">Guardar sesión</button>' +
          '<button class="btn" data-act="focus-save" data-mark="1">Guardar y marcar la acción como hecha</button>' +
          '<button class="btn ghost" data-act="focus-cancel-finish">Seguir</button></div>';
      } else {
        h += '<div class="row"><button class="btn primary" data-act="focus-pause">' + (a.pausedAt ? 'Continuar' : 'Pausar') + '</button>' +
          '<button class="btn" data-act="focus-finish">Terminar</button><button class="btn ghost danger" data-act="focus-discard" data-confirm="1">Descartar</button></div>';
      }
      h += '</section><section class="panel"><h2>Sonido</h2><label class="field">Fondo<select id="soundSel">' +
        L.SOUNDS.map(function (s) { return '<option value="' + s + '"' + (state.settings.sound === s ? ' selected' : '') + '>' + SOUND_NAMES[s] + '</option>'; }).join('') + '</select></label>' +
        '<label class="field">Volumen<input class="vol" id="vol" type="range" min="0" max="1" step="0.05" value="' + state.settings.volume + '"></label></section></div>' +
        '<div><section class="panel"><h2>Notas de la sesión</h2><label class="sr" for="notes">Notas</label>' +
        '<textarea id="notes" maxlength="1000" placeholder="Qué hiciste, qué quedó trabado, qué sigue">' + esc(a.notes || '') + '</textarea></section>' +
        '<section class="panel"><h2>Distracciones</h2><p class="hint">Anotá lo que te distrae y volvé a lo tuyo. Lo revisás después.</p>' +
        '<form id="distForm" class="row-form"><label class="sr" for="distInput">Distracción</label><input id="distInput" type="text" maxlength="140" autocomplete="off" placeholder="Ej: revisar mensajes">' +
        '<button class="btn" type="submit">Anotar</button></form>';
      if (a.distractions.length) {
        h += '<ul class="list">';
        a.distractions.forEach(function (t, i) { h += '<li><span class="grow">' + esc(t) + '</span><button class="x" data-act="dist-del" data-i="' + i + '" aria-label="Quitar">×</button></li>'; });
        h += '</ul>';
      }
      h += '</section></div></div>';
    } else {
      var todayK = key(new Date());
      var tb = state.blocks.filter(function (b) { return b.date === todayK && idx.has(b.actionId); }).sort(function (x, y) { return x.start - y.start; });
      h += head('Foco') + '<div class="focus-grid"><div><section class="panel"><h2>Bloques de hoy</h2>';
      if (!tb.length) h += '<p class="empty">No hay bloques agendados para hoy. Agendá uno en Semana o empezá una sesión libre.</p>';
      else {
        h += '<ul class="list">';
        tb.forEach(function (b) {
          var i = idx.get(b.actionId);
          h += '<li style="' + gcStyle(i.g) + '"><span class="grow">' + (b.done ? '✓ ' : '') + esc(i.a.title) + '<small>' + hm(b.start) + '–' + hm(b.start + b.dur) + ' · ' + esc(i.g.title) + '</small></span>' +
            (b.done ? '<span class="chip">Hecho</span>' : '<button class="btn small primary" data-act="focus-start-block" data-block-id="' + b.id + '">Empezar</button>') + '</li>';
        });
        h += '</ul>';
      }
      h += '</section><section class="panel"><h2>Sesión libre</h2>';
      var opts = actionOptions(null);
      if (!opts) h += '<p class="empty">Cargá acciones en Plan para poder elegir una.</p>';
      else {
        h += '<label class="field">Acción<select id="fAction">' + opts + '</select></label>' +
          '<label class="field">Duración<select id="fDur">' + [25, 45, 60, 90].map(function (d) { return '<option value="' + d + '"' + (d === 25 ? ' selected' : '') + '>' + d + ' min</option>'; }).join('') + '</select></label>' +
          '<div class="row"><button class="btn primary" data-act="focus-start-free">Empezar</button></div>';
      }
      h += '</section></div><section class="panel"><h2>Hoy</h2>';
      var ts = state.sessions.filter(function (s) { return s.date === todayK; });
      if (!ts.length) h += '<p class="empty">Todavía no registraste sesiones hoy.</p>';
      else {
        var sum = 0;
        h += '<ul class="list">';
        ts.slice().reverse().forEach(function (s) {
          sum += s.min;
          h += '<li style="--gc:var(--c' + ((s.color || 0) % 6) + ')"><span class="grow">' + esc(s.title) + '<small>' + fmtDur(s.min) + (s.distractions ? ' · ' + s.distractions + ' distracciones' : '') + (s.notes ? ' · ' + esc(s.notes.slice(0, 120)) : '') + '</small></span></li>';
        });
        h += '</ul><div class="meta">Total de hoy: ' + fmtDur(sum) + '</div>';
      }
      h += '</section></div>';
    }
    return h;
  }

  /* ---------- Coaching ---------- */
  function viewCoach() {
    var now = new Date(), ps = L.planStrength(state, now), cp = L.compass(state, mondayOf(now));
    var h = head('Coaching') + '<div class="two-col"><div class="stack">';
    h += '<section class="card tone-' + ps.tone + '"><div class="strength-top">' + ringHTML(ps) + '<div><h2>Fuerza del plan</h2><div class="lbl">' + esc(ps.label) + '</div></div></div><ul class="checks">';
    ps.checks.forEach(function (c) {
      h += '<li><div class="check-row"><span>' + esc(c.title) + '</span><span class="meta">' + c.got + ' / ' + c.max + '</span></div><div class="mini"><i style="width:' + (c.got / c.max * 100) + '%"></i></div>' +
        (c.tip ? '<p class="hint" style="margin-top:6px">' + esc(c.tip) + (c.go ? ' <button class="btn small ghost" data-go="' + c.go + '">Ir</button>' : '') + '</p>' : '') + '</li>';
    });
    h += '</ul></section><section class="card"><h2>Brújula</h2><p class="hint">Cómo se reparte el tiempo agendado de esta semana entre tus metas.</p>';
    if (!cp.rows.length) h += '<p class="empty">Todavía no hay metas.</p>';
    else {
      cp.rows.forEach(function (r) {
        h += '<div class="cp-row" style="' + gcStyle(r) + '"><div class="cp-top"><span class="dot"></span><span class="grow">' + esc(r.title) + '</span>' +
          '<span class="meta">' + fmtDur(r.planned) + (cp.total ? ' · ' + Math.round(r.share * 100) + '%' : '') + '</span></div><div class="mini"><i style="width:' + (r.share * 100) + '%"></i></div>' +
          '<span class="meta">Hecho ' + fmtDur(r.done) + ' · Foco ' + fmtDur(r.focus) + '</span></div>';
      });
      if (cp.idle.length) h += '<p class="warn">Sin tiempo agendado esta semana: ' + esc(cp.idle.map(function (r) { return r.title; }).join(', ')) + '.</p>';
    }
    h += '</section></div><div class="stack">' + coachCard('week');
    var refs = [];
    for (var i = 0; i < 7; i++) { var k = key(addDays(now, -i)); if (state.reflections[k]) refs.push({ k: k, r: state.reflections[k] }); }
    h += '<section class="card"><h2>Cierres recientes</h2>';

    else {
      h += '<ul class="refl">';
      refs.forEach(function (x) {
        var d = L.parseKey(x.k);
        h += '<li><b>' + esc(DAYS[(d.getDay() + 6) % 7] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]) + '</b>' + (x.r.went ? '<p>Bien: ' + esc(x.r.went) + '</p>' : '') + (x.r.change ? '<p>Ajustar: ' + esc(x.r.change) + '</p>' : '') + '</li>';
      });
      h += '</ul>';
    }
    h += '</section><section class="card"><h2>Tu semana</h2><label class="field">Horas por semana que podés dedicar<input id="capacity" type="number" min="1" max="100" value="' + state.settings.capacity + '"></label>' +
      '<p class="hint">Se usa para medir si tu semana es realista.</p></section></div></div>';
    return h;
  }

  /* ---------- Ventanas ---------- */
  function composeHTML(d) {
    var opts = actionOptions(d.actionId);
    if (!opts) {
      return '<div class="modal" role="dialog" aria-modal="true" aria-label="Agendar"><h2>Agendar un bloque</h2><p class="empty">Primero cargá al menos una acción en Plan.</p>' +
        '<div class="row end"><button class="btn" data-act="close-overlay">Cerrar</button><button class="btn primary" data-act="go-plan">Ir a Plan</button></div></div>';
    }
    var edit = !!d.blockId;
    return '<div class="modal" role="dialog" aria-modal="true" aria-label="' + (edit ? 'Cambiar horario' : 'Agendar un bloque') + '"><h2>' + (edit ? 'Cambiar horario' : 'Agendar un bloque') + '</h2>' +
      '<label class="field">Acción<select id="cAction">' + opts + '</select></label>' +
      '<div class="two"><label class="field">Día<input id="cDate" type="date" value="' + esc(d.date) + '"></label>' +
      '<label class="field">Hora de inicio<input id="cStart" type="time" step="900" value="' + hm(d.start) + '"></label></div>' +
      '<label class="field">Duración<select id="cDur">' + DUR_OPTS.map(function (m) { return '<option value="' + m + '"' + (m === d.dur ? ' selected' : '') + '>' + fmtDur(m) + '</option>'; }).join('') + '</select></label>' +
      '<p class="msg" id="cMsg"></p><p class="warn" id="cWarn"></p>' +
      '<div class="row end"><button class="btn" data-act="close-overlay">Cancelar</button><button class="btn primary" id="cSave" data-act="compose-save">' + (edit ? 'Guardar' : 'Agendar') + '</button></div></div>';
  }
  function blockHTML(d) {
    var idx = index(), b = state.blocks.find(function (x) { return x.id === d.id; }), i = b && idx.get(b.actionId);

      touch(); render(); applySound();
    }
    else if (act === 'focus-finish') { ui.finishing = true; if (state.active && !state.active.pausedAt) { state.active.pausedAt = Date.now(); touch(); } render(); applySound(); }
    else if (act === 'focus-cancel-finish') {
      a = state.active;
      if (a && a.pausedAt) { a.pausedMs = (a.pausedMs || 0) + (Date.now() - a.pausedAt); a.pausedAt = null; }
      ui.finishing = false; touch(); render(); applySound();
    }
    else if (act === 'focus-save') {
      a = state.active; if (!a) return;
      var notes = String(a.notes || '') + (a.distractions.length ? (a.notes ? '\n' : '') + 'Distracciones: ' + a.distractions.join('; ') : '');
      state.sessions.push({ id: uid('f_'), actionId: a.actionId, goalId: a.goalId || '', title: a.title, goal: a.goal, color: a.color, date: key(new Date(a.startedAt)),
        min: Math.max(1, Math.round(elapsed(a) / 60000)), notes: notes.slice(0, 1000), distractions: a.distractions.length });
      b = a.blockId && blockById(a.blockId); if (b) b.done = true;
      if (t.dataset.mark) { var ai2 = index().get(a.actionId); if (ai2) ai2.a.done = true; }
      state.active = null; ui.finishing = false; touch(); render(); applySound();
    }
    else if (act === 'focus-discard') { state.active = null; ui.finishing = false; touch(); render(); applySound(); }
    else if (act === 'dist-del') { if (state.active) { state.active.distractions.splice(Number(t.dataset.i), 1); touch(); render(); } }
    else if (act === 'clear-examples') {
      var ex = state.goals.filter(function (g) { return g.example; }), ids = {};
      ex.forEach(function (g) { Object.assign(ids, idsOf(g.seasons)); });
      state.goals = state.goals.filter(function (g) { return !g.example; });
      dropBlocksFor(ids); touch(); render();
    }
    else if (act === 'cycle-color') { var g1 = findGoal(t); if (g1) { g1.color = ((g1.color || 0) + 1) % 6; touch(); render(); } }
    else if (act === 'del-goal') { var g2 = findGoal(t); if (!g2) return; var ids2 = idsOf(g2.seasons); state.goals = state.goals.filter(function (g) { return g !== g2; }); dropBlocksFor(ids2); touch(); render(); }
    else if (act === 'add-season') {
      var g3 = findGoal(t); if (!g3) return;
      var s0 = new Date();
      g3.seasons.push({ id: uid('s_'), name: 'Temporada ' + (g3.seasons.length + 1), start: key(s0), end: key(addDays(s0, 27)), actions: [] });
      touch(); render();
    }
    else if (act === 'del-season') {
      var g4 = findGoal(t), se4 = findSeason(t); if (!g4 || !se4) return;
      var ids4 = idsOf([se4]); g4.seasons = g4.seasons.filter(function (s) { return s !== se4; }); dropBlocksFor(ids4); touch(); render();
    }
    else if (act === 'del-act') {
      var se5 = findSeason(t), ac5 = findAction(t); if (!se5 || !ac5) return;
      se5.actions = se5.actions.filter(function (x) { return x !== ac5; });
      var one = {}; one[ac5.id] = 1; dropBlocksFor(one); touch(); render();
    }
    else if (act === 'ics-import') { var fi = $('#icsFile'); if (fi) fi.click(); }
    else if (act === 'ics-clear') { state.busy = []; ui.flash = 'Quité los eventos importados.'; touch(); render(); }
    else if (act === 'csv-export') {
      if (!dl) return;
      var csv = L.buildCSV(state, new Date());
      if (csv.split('\r\n').length <= 2) { ui.flash = 'No hay bloques desde hoy para exportar.'; render(); return; }
      dl.save({ filename: 'foco-semanal.csv', data: csv }).then(function () { ui.flash = 'Listo. En Google Calendar usá Configuración > Importar y exportar para subir el archivo.'; render(); },
        function (er) { if (er && er.code !== 'declined') { ui.flash = 'No se pudo guardar el archivo.'; render(); } });
    }
    else if (act === 'plan-open') {
      var g5 = t.closest('[data-goal]') ? findGoal(t) : null;
      ui.dialog = { type: 'plan', step: 'form', goalId: g5 ? g5.id : null, input: { goal: g5 ? g5.title : '', weeks: 4, hours: state.settings.capacity } };
      renderOverlay();
    }
    else if (act === 'plan-generate') aiPlan();
    else if (act === 'plan-stop') { if (ui.ai.ctl) ui.ai.ctl.abort(); }
    else if (act === 'plan-back') { if (ui.dialog) { ui.dialog.step = 'form'; renderOverlay(); } }
    else if (act === 'plan-add') {
      var pd = ui.dialog, acts = [];
      [].slice.call($('#overlay').querySelectorAll('.prev li')).forEach(function (li) {
        if (!li.querySelector('input[type=checkbox]').checked) return;
        var title = li.querySelector('.pv-title').value.trim();
        if (!title) return;
        acts.push({ id: uid('a_'), title: title.slice(0, 140), est: Math.round(Math.max(5, Math.min(600, Number(li.querySelector('.pv-est').value) || 60))), done: false });
      });
      if (!acts.length) { $('#pMsg2').textContent = 'Elegí al menos una acción.'; return; }
      var start = new Date(), season = { id: uid('s_'), name: pd.plan.season, start: key(start), end: key(addDays(start, pd.input.weeks * 7 - 1)), actions: acts };
      var tg = pd.goalId && state.goals.find(function (g) { return g.id === pd.goalId; });
      if (tg) tg.seasons.push(season);
      else state.goals.unshift({ id: uid('g_'), title: pd.plan.goal || pd.input.goal.slice(0, 120), color: state.goals.length % 6, why: pd.plan.why || '', seasons: [season] });
      ui.dialog = null; ui.tab = 'plan'; touch(); render();
    }
    else if (act === 'coach-day') aiCoach('day');
    else if (act === 'coach-week') aiCoach('week');
    else if (act === 'coach-stop') { if (ui.ai.ctl) ui.ai.ctl.abort(); }
  });

  document.addEventListener('change', function (e) {
    var el = e.target, f = el.dataset && el.dataset.f;
    if (el.id === 'cAction') { var i = index().get(el.value); if (i) $('#cDur').value = String(L.nearestDur(Number(i.a.est) || 60)); checkCompose(); return; }
    if (el.id === 'cDate' || el.id === 'cStart' || el.id === 'cDur') { checkCompose(); return; }
    if (el.id === 'soundSel') { state.settings.sound = L.SOUNDS.indexOf(el.value) >= 0 ? el.value : 'off'; touch(); applySound(); return; }
    if (el.id === 'capacity') { state.settings.capacity = Math.round(Math.max(1, Math.min(100, Number(el.value) || 20))); el.value = state.settings.capacity; touch(); return; }
    if (el.id === 'icsFile') {
      var file = el.files && el.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { ui.flash = 'El archivo pesa más de 2 MB. Exportá un rango más corto desde tu calendario.'; el.value = ''; render(); return; }
      file.text().then(function (txt) {
        var res = L.parseICS(txt, new Date());
        state.busy = res.events.map(function (ev) { return { id: uid('e_'), date: ev.date, start: ev.start, dur: ev.dur, title: ev.title }; });
        var extra = [];
        if (res.allDay) extra.push(res.allDay + ' de todo el día se omitieron');
        if (res.unsupported) extra.push(res.unsupported + ' con repetición mensual o anual se importaron una sola vez');
        ui.flash = res.events.length ? 'Importé ' + res.events.length + ' eventos de las próximas semanas' + (extra.length ? ' (' + extra.join('; ') + ')' : '') + '.' : 'No encontré eventos en las próximas semanas.';
        touch(); render();
      }, function () { ui.flash = 'No pude leer el archivo.'; render(); });
      el.value = '';
      return;
    }
    if (!f) return;
    var g = findGoal(el), se = findSeason(el), a = findAction(el);
    if (f === 'goal-title' && g) g.title = el.value.trim() || 'Meta sin nombre';
    else if (f === 'goal-why' && g) g.why = el.value.trim();
    else if (f === 'season-name' && se) se.name = el.value.trim() || 'Temporada';
    else if (f === 'season-start' && se && el.value) se.start = el.value;
    else if (f === 'season-end' && se && el.value) se.end = el.value;
    else if (f === 'act-title' && a) a.title = el.value.trim() || 'Acción sin nombre';
    else if (f === 'act-est' && a) a.est = Math.max(5, Math.min(600, Number(el.value) || 30));
    else if (f === 'act-done' && a) { a.done = el.checked; var li = el.closest('li'); if (li) li.classList.toggle('done', a.done); }
    else return;
    if (se) { var m = document.querySelector('[data-meta="' + se.id + '"]'); if (m) m.textContent = seasonMeta(se); }
    touch();
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id === 'cStart') checkCompose();
    else if (el.id === 'notes' && state.active) { state.active.notes = el.value; touch(); }
    else if (el.id === 'vol') { state.settings.volume = Math.max(0, Math.min(1, Number(el.value) || 0)); touch(); applySound(); }
    else if (el.dataset && (el.dataset.f === 'ref-went' || el.dataset.f === 'ref-change')) {
      var k = key(new Date()), r = state.reflections[k] || { went: '', change: '' };
      if (el.dataset.f === 'ref-went') r.went = el.value; else r.change = el.value;
      if (r.went.trim() || r.change.trim()) state.reflections[k] = r; else delete state.reflections[k];
      touch();
    }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === 'newGoal') {
      var inp = $('#newGoalTitle'), title = inp.value.trim();
      if (!title) return;
      var s0 = new Date();
      state.goals.unshift({ id: uid('g_'), title: title, color: state.goals.length % 6, why: '', seasons: [{ id: uid('s_'), name: 'Temporada 1', start: key(s0), end: key(addDays(s0, 27)), actions: [] }] });
      touch(); render();
      var n = $('#newGoalTitle'); if (n) n.focus();
    } else if (f.classList.contains('add-action')) {
      var se = findSeason(f), input = f.querySelector('input'), t = input.value.trim();
      if (!se || !t) return;
      se.actions.push({ id: uid('a_'), title: t, est: 60, done: false });
      touch(); render();
      var again = document.getElementById('na_' + se.id); if (again) again.focus();
    } else if (f.id === 'distForm') {
      var di = $('#distInput'), txt = di.value.trim();
      if (!txt || !state.active) return;
      if (state.active.distractions.length >= 50) return;
      state.active.distractions.push(txt.slice(0, 140));
      touch(); render();
      var d2 = $('#distInput'); if (d2) d2.focus();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && ui.dialog) {
      if (ui.ai.ctl && ui.dialog.type === 'plan' && ui.dialog.step === 'busy') ui.ai.ctl.abort();
      ui.dialog = null; renderOverlay(); if (pendingRender) render();
    }
  });
  document.addEventListener('visibilitychange', tick);
  /* Si llegó un cambio remoto mientras escribías, se muestra recién cuando soltás el campo (con demora para no perder un clic) */
  document.addEventListener('focusout', function () {
    if (!pendingRender) return;
    setTimeout(function () {
      var ae = document.activeElement;
      if (pendingRender && !ui.dialog && !(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) render();
    }, 400);
  });

  /* ---------- Inicio ---------- */
  state = L.normalize(readLocal() || L.seed(new Date()));
  lastJson = L.stable(state);
  render();
  setInterval(tick, 500);
  window.addEventListener('online', function () { if (dirty) flush(); });
  connect();
})();
</script>
</body></html>
