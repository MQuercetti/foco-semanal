<title>Foco Semanal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&display=swap">
<style>
/* Foco Semanal · lenguaje visual: horario de cursada.
   Una sola cosa llama la atención: bloques sólidos del color de cada meta (agenda, semana, foco). El resto queda quieto: texto, aire y líneas finas. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --ink: #10131a;
  --ink-2: #566070;
  --line: #dde1e8;
  --accent: #2336d1;
  --on-accent: #ffffff;
  --danger: #bd2a22;
  --bad: #c0302a;
  --mid: #9a5b00;
  --good: #0f7a50;
  --c0: #2336d1; --c0-on: #ffffff;
  --c1: #c93a24; --c1-on: #ffffff;
  --c2: #0f7a50; --c2-on: #ffffff;
  --c3: #7339d6; --c3-on: #ffffff;
  --c4: #b87a00; --c4-on: #10131a;
  --c5: #c42d6b; --c5-on: #ffffff;
  --font-body: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: var(--font-body);
  --font-mono: var(--font-body);
  --row: 44px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1015; --surface: #151a21; --surface-2: #1d232c; --ink: #eef1f5; --ink-2: #9ba6b4; --line: #272f3a;
    --accent: #8fa3ff; --on-accent: #0d1015; --danger: #ff8b82; --bad: #ff8b82; --mid: #f0b24a; --good: #4fd39a;
    --c0: #8fa3ff; --c0-on: #0d1015; --c1: #ff8f78; --c1-on: #0d1015; --c2: #3fcfc6; --c2-on: #0d1015;
    --c3: #bd9bff; --c3-on: #0d1015; --c4: #ffd24a; --c4-on: #0d1015; --c5: #ff90ba; --c5-on: #0d1015;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1015; --surface: #151a21; --surface-2: #1d232c; --ink: #eef1f5; --ink-2: #9ba6b4; --line: #272f3a;
  --accent: #8fa3ff; --on-accent: #0d1015; --danger: #ff8b82; --bad: #ff8b82; --mid: #f0b24a; --good: #4fd39a;
  --c0: #8fa3ff; --c0-on: #0d1015; --c1: #ff8f78; --c1-on: #0d1015; --c2: #3fcfc6; --c2-on: #0d1015;
  --c3: #bd9bff; --c3-on: #0d1015; --c4: #ffd24a; --c4-on: #0d1015; --c5: #ff90ba; --c5-on: #0d1015;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-inline: 16px; padding-block: 20px 28px; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Estructura */
.shell { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 40px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); display: grid; gap: 28px; }
.rail-top { display: grid; gap: 6px; justify-items: start; }
.brand { font-weight: 800; font-size: 22px; letter-spacing: -0.04em; line-height: 1; }
.brand small { display: none; }
.status { font-size: 12px; color: var(--ink-2); min-height: 18px; }
.pill { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: transform 140ms var(--ease-out); }
.pill:active { transform: scale(0.97); }
.nav { display: grid; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 9px 12px; border-radius: 10px; cursor: pointer; color: var(--ink-2); font-weight: 600; text-align: left; transition: background-color 140ms ease, color 140ms ease, transform 140ms var(--ease-out); }
.nav-item svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav-item:active { transform: scale(0.97); }
.nav-item[aria-current="page"] { background: var(--ink); color: var(--bg); }
@media (hover: hover) and (pointer: fine) { .nav-item:hover:not([aria-current="page"]) { background: var(--surface-2); color: var(--ink); } }
main { min-width: 0; }

/* Piezas comunes */
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 20px; margin-bottom: 28px; }
.day-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 32px; }
.daynum { font-size: clamp(76px, 11vw, 120px); line-height: 0.8; font-weight: 800; letter-spacing: -0.06em; }
.daytxt { display: grid; gap: 2px; padding-bottom: 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.daytxt span + span { color: var(--ink-2); font-weight: 500; font-size: 16px; letter-spacing: 0; }
.card { display: grid; gap: 14px; align-content: start; min-width: 0; border-top: 1px solid var(--line); padding-top: 18px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.stack { display: grid; gap: 32px; align-content: start; min-width: 0; }
.stack > .card:first-child { border-top: 0; padding-top: 0; }
.two-col { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 15px; cursor: pointer; font-weight: 600; transition: transform 140ms var(--ease-out), background-color 140ms ease, border-color 140ms ease, color 140ms ease; }
.btn:active:not([disabled]) { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .btn:hover:not([disabled]) { border-color: var(--ink-2); } }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; min-width: 0; max-width: 100%; transition: border-color 140ms ease, background-color 140ms ease;
}
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
textarea { width: 100%; resize: vertical; min-height: 120px; line-height: 1.45; }
.field textarea { min-height: 80px; }
.field { display: grid; gap: 5px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.field select, .field input, .field textarea { font-size: 15px; font-weight: 400; color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row-form { display: flex; gap: 8px; flex: 1 1 320px; max-width: 540px; min-width: 0; }
.row-form input { flex: 1; min-width: 0; }
.row-form .btn { flex: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.meta { font-size: 13px; color: var(--ink-2); }
.hint { color: var(--ink-2); font-size: 14px; }
.empty { color: var(--ink-2); }
.msg { min-height: 18px; font-size: 13px; color: var(--danger); }
.warn { font-size: 13px; color: var(--mid); }
.chip { font-size: 12px; font-weight: 600; padding: 2px 9px; border: 1px solid currentColor; border-radius: 999px; opacity: 0.85; white-space: nowrap; }
.note { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 16px; background: var(--surface-2); border-radius: 12px; margin-bottom: 20px; color: var(--ink-2); font-size: 14px; }
.flash { padding: 10px 14px; border-radius: 10px; background: var(--surface-2); font-size: 14px; margin-bottom: 14px; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); flex: none; display: inline-block; }
.goalname { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 14px; }
.goalname i { width: 10px; height: 10px; border-radius: 3px; background: var(--gc); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.list li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list .grow { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.list small { display: block; color: var(--ink-2); font-size: 13px; font-weight: 400; }
.x { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 20px; line-height: 1; padding: 4px 9px; border-radius: 8px; }
@media (hover: hover) and (pointer: fine) { .x:hover { color: var(--danger); background: var(--surface-2); } }
.mini { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

/* Hoy: agenda del día en bloques de color */
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.tl li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 14px 16px; border-radius: 14px; background: var(--gc, var(--surface-2)); color: var(--on, var(--ink)); }
.tl li.busy { background: transparent; color: var(--ink-2); border: 1px dashed var(--line); }
.tl li.done { opacity: 0.55; }
.tl li.done .grow b { text-decoration: line-through; }
.tl time { font-size: 13px; font-weight: 600; min-width: 96px; opacity: 0.9; }
.tl .grow { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; }
.tl .grow b { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; display: block; }
.tl .grow small { display: block; font-size: 13px; opacity: 0.85; margin-top: 1px; }
.tl li .btn { background: color-mix(in srgb, var(--on) 14%, transparent); border-color: transparent; color: var(--on); }
.tl li .btn.primary { background: var(--on); color: var(--gc); }
.tl li .btn.ghost { background: transparent; }
.tl li.busy .btn { color: var(--ink); }
.strength-top { display: flex; align-items: center; gap: 16px; }
.score { display: grid; gap: 8px; min-width: 96px; }
.score b { font-size: 68px; line-height: 0.85; font-weight: 800; letter-spacing: -0.05em; }
.sbar { display: block; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.sbar i { display: block; height: 100%; background: var(--rc, var(--bad)); border-radius: 3px; }
.tone-mid { --rc: var(--mid); }
.tone-good { --rc: var(--good); }
.tone-bad { --rc: var(--bad); }
.lbl { font-size: 15px; font-weight: 700; color: var(--rc, var(--ink)); }
.tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.tips li { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; font-size: 14px; }
.tips li span { min-width: 0; overflow-wrap: anywhere; }
.coach-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.6; max-width: 62ch; }
.todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.todo li { display: flex; align-items: center; gap: 10px; }
.todo .t { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.todo .t small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-2); }

/* Plan */
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 18px; }
.goal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 6px; }
.swatch { width: 28px; height: 28px; border-radius: 8px; border: 0; background: var(--gc); cursor: pointer; flex: none; transition: transform 140ms var(--ease-out); }
.swatch:active { transform: scale(0.92); }
.goal-title { flex: 1 1 220px; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; background: transparent !important; border-color: transparent !important; padding-inline: 6px; }
.goal-why { width: 100%; color: var(--ink-2); margin-bottom: 4px; background: transparent !important; border-color: transparent !important; padding-inline: 6px; }
@media (hover: hover) and (pointer: fine) { .goal-title:hover, .goal-why:hover { background: var(--surface-2) !important; } }
.goal-title:focus, .goal-why:focus { background: var(--surface) !important; border-color: var(--accent) !important; }
.season { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.season-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.season-head .s-name { flex: 1 1 200px; font-weight: 700; }
.date-l { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.actions { list-style: none; margin: 0 0 8px; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.actions li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.actions li.done .a-title { text-decoration: line-through; color: var(--ink-2); }
.actions input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--gc, var(--accent)); flex: none; }
.a-title { flex: 1; min-width: 0; }
.a-est { width: 72px; flex: none; }
.unit { color: var(--ink-2); font-size: 13px; }
.add-action input { width: 100%; border-style: dashed; }

/* Semana */
.week-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px; margin-bottom: 14px; }
.week-bar h1 { margin-right: auto; font-size: 30px; }
.tools { margin-bottom: 14px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 28px; margin-bottom: 12px; font-size: 14px; color: var(--ink-2); }
.stats b { color: var(--ink); font-weight: 700; }
.hours-bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-bottom: 20px; position: relative; }
.hours-bar i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--accent) 35%, var(--surface-2)); border-radius: 3px; }
.hours-bar i.done { background: var(--accent); }
.week-layout { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 24px; align-items: start; }
.week-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.week { min-width: 700px; }
.week-head, .week-body { display: grid; grid-template-columns: 44px repeat(7, minmax(0, 1fr)); }
.week-head { border-bottom: 1px solid var(--line); }
.dh { padding: 10px 6px 8px; text-align: center; font-size: 13px; color: var(--ink-2); font-weight: 500; position: relative; }
.dh b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); line-height: 1.15; }
.dh.today b { color: var(--accent); }
.dh.today::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: -1px; height: 3px; background: var(--accent); border-radius: 3px 3px 0 0; }
.hours div { height: var(--row); font-size: 11px; color: var(--ink-2); text-align: right; padding-right: 8px; transform: translateY(-8px); }
.col { position: relative; border-left: 1px solid var(--line); cursor: cell; background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% var(--row); }
.col.today { background-color: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.blk { position: absolute; left: 3px; right: 3px; text-align: left; border: 0; border-radius: 9px; padding: 5px 8px; overflow: hidden; cursor: grab; font-size: 12px; line-height: 1.2; user-select: none;
  background: var(--gc); color: var(--on, var(--ink)); transition: transform 140ms var(--ease-out); }
.blk:active { transform: scale(0.98); }
.blk b { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-weight: 700; font-size: 12.5px; }
.blk span { font-size: 11px; opacity: 0.88; }
.blk.short b { -webkit-line-clamp: 1; }
.blk.short { padding-block: 4px; }
.blk.tiny span { display: none; }
.blk.done { opacity: 0.5; }
.blk.done b { text-decoration: line-through; }
.blk.dragging { z-index: 5; opacity: 0.92; cursor: grabbing; box-shadow: 0 8px 24px rgba(8, 12, 20, 0.28); transition: none; }
.busyblk { position: absolute; left: 3px; right: 3px; border-radius: 9px; padding: 3px 8px; overflow: hidden; font-size: 11.5px; color: var(--ink-2); border: 1px dashed var(--ink-2);
  background: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--ink-2) 14%, transparent) 6px 7px); }
.now { position: absolute; left: 0; right: 0; height: 2px; background: var(--danger); pointer-events: none; }
.now::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
.side { padding: 0 0 0 4px; }
.side h2 { margin-bottom: 4px; }
.side p { margin: 0 0 12px; color: var(--ink-2); font-size: 13px; }
.todo .btn { flex: none; }

/* Foco: la sesión activa ocupa todo el color de la meta */
.focus-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.panel + .panel { margin-top: 20px; }
.panel.session { background: var(--gc); border-color: transparent; color: var(--on); padding: 28px 24px 24px; gap: 18px; }
.panel.session .goalname { color: var(--on); opacity: 0.85; }
.panel.session .goalname i { background: var(--on); }
.panel.session .meta { color: var(--on); opacity: 0.85; }
.panel.session .btn { background: color-mix(in srgb, var(--on) 14%, transparent); border-color: transparent; color: var(--on); }
.panel.session .btn.primary { background: var(--on); color: var(--gc); }
.panel.session .btn.ghost { background: transparent; }
.panel.session .btn.danger { color: var(--on); }
.panel.session h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.panel.session .bar { background: color-mix(in srgb, var(--on) 22%, transparent); }
.panel.session .bar i { background: var(--on); }
.clock { font-weight: 800; font-size: clamp(76px, 17vw, 168px); line-height: 0.9; letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
.clock.over { opacity: 0.75; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; border-radius: 4px; }
.vol { width: 100%; accent-color: var(--accent); }

/* Coaching */
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.check-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
.check-row .meta { white-space: nowrap; font-weight: 500; }
.cp-row { display: grid; gap: 5px; }

/* Ventanas */

@keyframes ov-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes modal-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
@keyframes sheet-in { from { transform: translateY(32px); opacity: 0.6; } to { transform: none; opacity: 1; } }

@media (max-width: 1100px) { .shell { gap: 28px; grid-template-columns: 148px minmax(0, 1fr); } .two-col { gap: 32px; } .week-layout { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) {

}
@media (max-width: 600px) {

  .modal { width: 100%; border-radius: 22px 22px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px)); animation: sheet-in 260ms var(--ease-sheet); max-height: 92%; }
  .row-form { flex-basis: 100%; max-width: 100%; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {

}

/* ===== v4: bloques libres, diario, asistente, foco bloqueante y movimiento ===== */
:root { --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1); }
body.locked { overflow: hidden; }

/* Navegación: el indicador se desliza entre secciones */
.nav { position: relative; }
.nav-ind { position: absolute; left: 0; top: 0; width: 0; height: 0; border-radius: 10px; background: var(--ink); pointer-events: none; z-index: 0; opacity: 0; }
.nav-ind.ready { opacity: 1; transition: transform 300ms var(--ease-sheet), width 300ms var(--ease-sheet), height 300ms var(--ease-sheet); }
.nav-item { position: relative; z-index: 1; }
.nav-item[aria-current="page"] { background: transparent; color: var(--bg); }
@media (max-width: 900px) {
  .nav-ind { background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 12px; }
  .nav-item[aria-current="page"] { background: transparent; color: var(--accent); }
}

/* Entrada de pantallas: se escalona, solo al cambiar de sección */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
@keyframes slide-l { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
@keyframes slide-r { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.enter { animation: rise 280ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 45ms); }
.slide-l { animation: slide-l 220ms var(--ease-out) both; }
.slide-r { animation: slide-r 220ms var(--ease-out) both; }
.blk.pop { animation: pop 220ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 30ms); }
.fresh { animation: rise 260ms var(--ease-out) both; }
.flash { animation: rise 220ms var(--ease-out) both; }
.tl li, .blk, .jentry { transition: opacity 200ms ease, transform 140ms var(--ease-out), background-color 160ms ease; }

/* Ventanas: salida simétrica a la entrada */
@keyframes ov-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes modal-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(0.97); } }
@keyframes sheet-out { from { transform: none; opacity: 1; } to { transform: translateY(28px); opacity: 0.4; } }
.overlay.closing { animation: ov-out 160ms ease-out forwards; pointer-events: none; }
.overlay.closing .modal { animation: modal-out 160ms var(--ease-out) forwards; }
@media (max-width: 600px) { .overlay.closing .modal { animation: sheet-out 200ms var(--ease-sheet) forwards; } }

/* Botones y controles */
.btn.big { padding: 13px 22px; font-size: 16px; border-radius: 12px; }
.check { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--ink); cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 1px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; transition: transform 140ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, color 160ms ease; }
.chip-btn:active { transform: scale(0.96); }
.chip-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
@media (hover: hover) and (pointer: fine) { .chip-btn:hover:not([aria-pressed="true"]) { border-color: var(--ink-2); } }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.cdot { width: 30px; height: 30px; border-radius: 9px; border: 0; background: var(--gc); cursor: pointer; position: relative; transition: transform 140ms var(--ease-out); }
.cdot:active { transform: scale(0.9); }
.cdot[aria-pressed="true"]::after { content: ""; position: absolute; inset: -4px; border: 2px solid var(--ink); border-radius: 12px; animation: pop 160ms var(--ease-out); }
.daychips { display: flex; gap: 6px; flex-wrap: wrap; }
.daychips .chip-btn { padding: 6px 0; width: 38px; text-align: center; }
.fgroup { display: grid; gap: 6px; }
.fgroup[hidden] { display: none; }
.field .meta { margin-top: 2px; }
.end { justify-content: flex-end; }
.row.end { justify-content: flex-end; }

/* Semana */
.sel-ghost { position: absolute; left: 3px; right: 3px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 22%, transparent); border: 2px solid var(--accent); pointer-events: none; z-index: 4; font-size: 11px; font-weight: 700; padding: 3px 6px; color: var(--accent); }
.routine { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.routine li { display: flex; align-items: center; gap: 10px; }
.routine .t { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.routine .t small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-2); }

/* Diario */
.jform { display: grid; gap: 10px; }
.jlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.jentry { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.jentry:first-child { border-top: 0; }
.jentry time { font-size: 13px; font-weight: 600; color: var(--ink-2); padding-top: 2px; }
.jentry p { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.55; }
.jentry .jact { display: flex; gap: 2px; opacity: 0.0; transition: opacity 160ms ease; }
.jentry:hover .jact, .jentry:focus-within .jact { opacity: 1; }
@media (hover: none) { .jentry .jact { opacity: 1; } }
.jentry.editing { grid-template-columns: minmax(0, 1fr); }
.jedit { min-height: 100px; }
.jgroup { display: grid; gap: 4px; padding-top: 22px; margin-top: 8px; border-top: 1px solid var(--line); }
.jgroup:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.jgroup h3 { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; text-transform: capitalize; }
.jmeta { font-size: 13px; color: var(--ink-2); padding: 2px 0 2px 60px; }
.jrefl { font-size: 14px; padding: 8px 0 2px 60px; display: grid; gap: 2px; }
.jrefl b { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
.searchbar { width: min(320px, 100%); }

/* Asistente */
.chat { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 14px; height: calc(100dvh - 150px); min-height: 440px; }
.chat-log { overflow-y: auto; display: grid; gap: 12px; align-content: start; padding: 2px 4px 8px 0; scroll-behavior: smooth; }
.bubble { max-width: min(640px, 92%); padding: 11px 15px; border-radius: 16px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; animation: rise 220ms var(--ease-out) both; }
.bubble.user { justify-self: end; background: var(--ink); color: var(--bg); border-bottom-right-radius: 5px; }
.bubble.bot { justify-self: start; background: var(--surface-2); border-bottom-left-radius: 5px; }
.bubble.err { color: var(--danger); }
.typing { display: inline-flex; gap: 4px; align-items: center; height: 18px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); animation: blink 1s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: 0.15s; } .typing i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.ops { justify-self: start; width: min(640px, 92%); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; background: var(--surface); animation: rise 240ms var(--ease-out) both; }
.ops h3 { font-size: 14px; font-weight: 800; }
.ops ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.ops .done { color: var(--good); font-size: 14px; font-weight: 600; }
.ops .off { color: var(--ink-2); font-size: 14px; }
.chat-form { display: grid; gap: 8px; }
.chat-box { display: flex; gap: 8px; align-items: flex-end; }
.chat-box textarea { min-height: 52px; max-height: 160px; resize: none; flex: 1; }
.sugs { display: flex; flex-wrap: wrap; gap: 8px; }
.chat-empty { display: grid; gap: 14px; align-content: center; justify-items: start; padding: 20px 0; }
.chat-empty h2 { font-size: 22px; }

/* Foco: pantalla de estudio que bloquea el resto */
#lock { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; padding: 22px 22px 28px; animation: fade 240ms ease-out both; }
#lock[hidden] { display: none; }
.lock-in { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; animation: rise 320ms var(--ease-out) both; }
.lock-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; font-size: 14px; color: var(--ink-2); }
.lock-tag { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); }
.lock-tag::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--good); }
.lock-tag.off::before { background: var(--ink-2); }
.lock-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
.lock-main { background: var(--gc); color: var(--on); border-radius: 20px; padding: 28px 24px 24px; display: grid; gap: 18px; }
.lock-main h2 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.lock-main .meta { color: var(--on); opacity: 0.85; }
.lock-main .btn { background: color-mix(in srgb, var(--on) 14%, transparent); border-color: transparent; color: var(--on); }
.lock-main .btn.primary { background: var(--on); color: var(--gc); }
.lock-main .btn.ghost { background: transparent; }
.lock-main .bar { background: color-mix(in srgb, var(--on) 22%, transparent); }
.lock-main .bar i { background: var(--on); }
.lock-main textarea, .lock-main input[type="text"], .lock-main select { background: color-mix(in srgb, var(--on) 10%, transparent); border-color: color-mix(in srgb, var(--on) 25%, transparent); color: var(--on); }
.lock-main textarea::placeholder, .lock-main input::placeholder { color: var(--on); opacity: 0.6; }
.lock-main .field { color: var(--on); opacity: 0.9; }
.lock-main .x { color: var(--on); }
.lock-main .list li { border-color: color-mix(in srgb, var(--on) 22%, transparent); }
.lock-main .vol { accent-color: var(--on); }
.lock-main .two { align-items: end; }
.hold { position: relative; overflow: hidden; }
.hold .hold-fill { position: absolute; inset: 0; background: var(--on); opacity: 0.3; clip-path: inset(0 100% 0 0); transition: clip-path 200ms var(--ease-out); pointer-events: none; }
.hold.holding .hold-fill { clip-path: inset(0 0 0 0); transition: clip-path 2.5s linear; }
.hold .hold-txt { position: relative; }
.lock-mat { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.mat-tabs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mat-frame { width: 100%; height: min(72vh, 760px); border: 1px solid var(--line); border-radius: 12px; background: #fff; }
.mat-img { max-width: 100%; max-height: 72vh; border-radius: 12px; justify-self: center; }
.mat-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.6; max-height: 72vh; overflow: auto; background: var(--surface-2); padding: 14px; border-radius: 12px; font-family: var(--font-body); }
.mat-note { display: grid; gap: 8px; }
.mat-note textarea { min-height: min(56vh, 520px); }
.mat-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.mat-item:first-child { border-top: 0; }
.mat-item .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; font-size: 14px; }
.mat-item small { display: block; font-weight: 400; color: var(--ink-2); font-size: 12px; }
.banner { padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--mid) 16%, var(--surface)); color: var(--ink); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 14px; animation: rise 220ms var(--ease-out) both; }
.setup { gap: 16px; }
.setup input[type="text"] { font-size: 17px; padding: 12px 14px; }

@media (max-width: 900px) {
  .lock-grid { grid-template-columns: minmax(0, 1fr); }
  #lock { padding: 16px 14px 24px; }
  .chat { height: calc(100dvh - 250px); }
  .jentry { grid-template-columns: 44px minmax(0, 1fr); }
  .jentry .jact { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
  .enter, .fresh, .flash, .bubble, .ops, .banner, .lock-in { animation: fade 160ms ease-out both; }
  .slide-l, .slide-r, .blk.pop { animation: fade 160ms ease-out both; }
  .nav-ind.ready { transition-property: width, height; }
  #lock { animation: fade 120ms ease-out both; }
  .chip-btn, .cdot { transition-property: background-color, border-color, color; }
  .chip-btn:active, .cdot:active { transform: none; }
  .overlay.closing .modal { animation: ov-out 120ms ease-out forwards; }
  .hold.holding .hold-fill { transition-duration: 2.5s; }
  .typing i { animation: none; opacity: 0.6; }
  .chat-log { scroll-behavior: auto; }
}

    if (!snap.exists) {

    }

    var pend = false;

    if (first && pend) { dirty = true; setStatus('Guardando…'); flush(); return; }
    if (first) dirty = false;
    else if (snap.metadata.hasPendingWrites || dirty || saving) return;
    var raw = L.clone(snap.data());
    var next = L.normalize(L.clone(raw));
    var j = L.stable(next);
    var migrated = first && L.stable(raw) !== j;
    if (j === lastJson && !migrated) { setStatus('Guardado'); return; }
    state = next;

          r.onupgradeneeded = function () { r.result.createObjectStore('items', { keyPath: 'id' }); };
          r.onsuccess = function () { res(r.result); };
          r.onerror = function () { rej(r.error); };
        } catch (e) { rej(e); }

    }
    function run(mode, fn) {
      return open().then(function (db) {
        return new Promise(function (res, rej) {
          var t = db.transaction('items', mode), req = fn(t.objectStore('items'));
          t.oncomplete = function () { res(req && req.result); };
          t.onerror = function () { rej(t.error); };
          t.onabort = function () { rej(t.error); };
        });
      });
    }
    return {
      all: function () { return run('readonly', function (s) { return s.getAll(); }); },
      put: function (it) { return run('readwrite', function (s) { return s.put(it); }); },

    if (el.id === 'cTitle') {
      var tv = el.value.trim().toLowerCase(), hit = tv && state.blocks.find(function (b) { return binfo(b).title.toLowerCase() === tv; });
      if (hit && ui.dialog && ui.dialog.type === 'compose' && !ui.dialog.blockId) {
        ui.dialog.color = binfo(hit).color;
        [].slice.call(document.querySelectorAll('.cdot')).forEach(function (x) { x.setAttribute('aria-pressed', String(Number(x.dataset.c) === ui.dialog.color)); });
      }
      checkCompose();
    }
    else if (el.id === 'cStart' || el.id === 'cEnd') checkCompose();
    else if (el.id === 'notes' && state.active) { state.active.notes = el.value; touch(); }
    else if (el.id === 'vol') { state.settings.volume = Math.max(0, Math.min(1, Number(el.value) || 0)); touch(); applySound(); }
    else if (el.id === 'jText') ui.draft = el.value;
    else if (el.id === 'chatText') ui.chat.draft = el.value;
    else if (el.id === 'fTitle') ui.fTitle = el.value;
    else if (el.id === 'fDurCustom') {
      var n = Number(el.value);
      if (n >= 5) { ui.fDur = Math.min(600, Math.round(n)); [].slice.call(document.querySelectorAll('[data-act="pick-dur"]')).forEach(function (x) { x.setAttribute('aria-pressed', 'false'); }); }
    }
    else if (el.id === 'jSearch') { ui.q = el.value; $('#jBody').innerHTML = diarioBody(); }
    else if (el.id === 'noteText' || el.id === 'noteName') {
      var m = matById(ui.matSel);
      if (!m || m.kind !== 'note') return;
      if (el.id === 'noteText') m.text = el.value.slice(0, 20000); else { m.name = el.value.trim().slice(0, 80) || 'Apunte'; var chip = document.querySelector('[data-act="mat-open"][data-id="' + m.id + '"]'); if (chip) chip.textContent = m.name.slice(0, 28); }
      saveNoteSoon(m);
    }
    else if (el.dataset && (el.dataset.f === 'ref-went' || el.dataset.f === 'ref-change')) {
      var k = key(new Date()), r = state.reflections[k] || { went: '', change: '' };
      if (el.dataset.f === 'ref-went') r.went = el.value; else r.change = el.value;
      if (r.went.trim() || r.change.trim()) state.reflections[k] = r; else delete state.reflections[k];
      touch();
    }
  });

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === 'cForm') saveCompose();
    else if (f.id === 'jForm') {
      var ta = $('#jText'), text = ta.value.trim();
      if (!text) return;
      var id = uid('j_');
      state.journal.push({ id: id, date: key(new Date()), ts: Date.now(), text: text.slice(0, 4000) });
      ui.draft = ''; ui.newJ = id; touch(); render();
      var again = $('#jText'); if (again) again.focus();
    }
    else if (f.id === 'chatForm') chatSend($('#chatText').value);
    else if (f.id === 'distForm') {
      var di = $('#distInput'), txt = di.value.trim();
      if (!txt || !state.active) return;
      if (state.active.distractions.length >= 50) return;
      state.active.distractions.push(txt.slice(0, 140));
      touch(); renderLockMain();
      var d2 = $('#distInput'); if (d2) d2.focus();
    }
  });

  window.addEventListener('blur', function () { setTimeout(function () { if (!document.hasFocus()) noteLeave(); }, 80); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) noteLeave(); tick(); });
  document.addEventListener('fullscreenchange', function () { if (state && state.active && !ui.peek) renderLock(); });
  window.addEventListener('resize', moveInd);
  if (window.focoDesktop && window.focoDesktop.onLeave) window.focoDesktop.onLeave(noteLeave);
  /* Si llegó un cambio remoto mientras escribías, se muestra recién cuando soltás el campo (con demora para no perder un clic) */
  document.addEventListener('focusout', function () {
    if (!pendingRender) return;
    setTimeout(function () {
      var ae = document.activeElement;
      if (pendingRender && !ui.dialog && !(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) render();
    }, 400);
  });

  /* ---------- Ventana de escritorio y búsqueda ---------- */
  (function () {
    var fd = window.focoDesktop;
    if (fd && fd.win) {
      document.body.classList.add('desk'); $('#titlebar').hidden = false;
      $('#titlebar').addEventListener('click', function (e) { var b = e.target.closest('[data-win]'); if (b) fd.win(b.dataset.win); });
      $('#titlebar').addEventListener('dblclick', function (e) { if (!e.target.closest('.tb-btns')) fd.win('max'); });
      if (fd.onMax) fd.onMax(function (m) { var b = $('#tbMax'); if (b) b.innerHTML = m ? '<svg viewBox="0 0 12 12"><rect x="1.5" y="3.5" width="7" height="7"/><path d="M3.5 3.5v-2h7v7h-2"/></svg>' : '<svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg>'; });
      fd.win('state');
    }
    document.addEventListener('dragover', function (e) { if (ui.tab === 'asistente' && e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) { e.preventDefault(); var ch = $('.chat'); if (ch) ch.classList.add('drop'); } });
    document.addEventListener('dragleave', function (e) { if (!e.relatedTarget) { var ch = $('.chat'); if (ch) ch.classList.remove('drop'); } });
    document.addEventListener('drop', function (e) { var ch = $('.chat'); if (ch) ch.classList.remove('drop'); if (ui.tab === 'asistente' && e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); addFiles(e.dataTransfer.files); } });
    document.addEventListener('paste', function (e) { if (ui.tab !== 'asistente' || !e.clipboardData) return; var fs = [].slice.call(e.clipboardData.files || []); if (fs.length) { e.preventDefault(); addFiles(fs); } });
    var gs = $('#gSearch'), tr = $('#tres');
    gs.addEventListener('input', function () { var h = searchResults(gs.value); tr.innerHTML = h; tr.hidden = !h; });
    gs.addEventListener('keydown', function (e) { if (e.key === 'Escape') { tr.hidden = true; gs.blur(); } else if (e.key === 'Enter') { var f = tr.querySelector('button'); if (f) f.click(); } });
    document.addEventListener('click', function (e) { if (!e.target.closest('.tsearch')) tr.hidden = true; });
    window.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k' && !state.active) { e.preventDefault(); gs.focus(); gs.select(); } });
  })();

  /* ---------- Inicio ---------- */
  state = L.normalize(readLocal() || L.seed(new Date()));
  lastJson = L.stable(state);
  ui.chat.msgs = chatLoad();
  try { ui.chat.auto = localStorage.getItem(AUTO_LS) === '1'; } catch (e0) { ui.chat.auto = false; }
  render();
  setInterval(tick, 500);
  window.addEventListener('online', function () { if (dirty) flush(); });
  connect();
  loadMats();
})();
</script>
</body></html>
